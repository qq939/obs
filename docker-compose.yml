services:
  obs:
    build:
      context: .
      dockerfile: Dockerfile.obs
    container_name: obs
    ports:
      - "80:8088"
    volumes:
      - "${OBS_DIR:-./obs}:/app/obs"
      - "${HLS_DIR:-./obs_shards}:/app/hls"
    environment:
      - PORT=8088
      - UPLOAD_DIR=/app/obs
      - HLS_DIR=/app/hls
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
