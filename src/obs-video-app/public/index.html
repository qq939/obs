<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>OBS 视频流</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="viewport" class="viewport" data-page="1">
        <div id="pages" class="pages">

            <!-- Page 0: info panel (swipe RIGHT to get here) -->
            <section class="page" data-page="0">
                <div class="panel-mask"></div>
                <div class="feed" id="feed0"></div>
                <aside class="side-panel info-panel" id="infoPanel">
                    <div class="panel-head">播放信息</div>
                    <div class="panel-body">
                        <div class="info-row"><span>文件名</span><b id="infoName">-</b></div>
                        <div class="info-row"><span>大小</span><b id="infoSize">-</b></div>
                        <div class="info-row"><span>时间</span><b id="infoTime">-</b></div>
                        <div class="info-row"><span>进度</span><b id="infoProgress">0%</b></div>
                        <div class="info-row"><span>索引</span><b id="infoIndex">-</b></div>
                    </div>
                </aside>
            </section>

            <!-- Page 1: main feed (default, centered) -->
            <section class="page" data-page="1">
                <div class="feed" id="mainFeed">
                    <div class="empty-state"><div class="empty-icon">🎬</div><p>还没有视频</p><p class="sub">长按空白处上传</p></div>
                </div>
                <div class="page-dot" id="pageDot"></div>
            </section>

            <!-- Page 2: settings panel (swipe LEFT to get here) -->
            <section class="page" data-page="2">
                <div class="panel-mask"></div>
                <div class="feed" id="feed2"></div>
                <aside class="side-panel settings-panel" id="settingsPanel">
                    <div class="panel-head">
                        <span>设置</span>
                        <button class="fab-upload" id="fabUpload" aria-label="上传视频">⬆ 上传</button>
                    </div>
                    <!-- 播放列表：固定在设置页上方，竖向排列的 5 格 (uuid, t) 队列视图（前 2 + 当前 + 后 2） -->
                    <div class="playlist-strip" id="playlistStrip"></div>
                    <div class="panel-body">
                        <div class="setting-row"><span>视频数量</span><b id="videoCount">0</b></div>
                        <div class="setting-row"><span>随机播放</span><label class="switch"><input type="checkbox" id="randomSwitch" checked><i></i></label></div>
                        <div class="setting-row"><span>自动播放</span><label class="switch"><input type="checkbox" id="autoplaySwitch" checked><i></i></label></div>
                        <div class="setting-row speed-row">
                            <span>播放速度</span>
                            <div class="speed-options" id="speedOptions">
                                <button class="speed-btn" data-speed="0.5">0.5x</button>
                                <button class="speed-btn" data-speed="0.8">0.8x</button>
                                <button class="speed-btn active" data-speed="1">1x</button>
                                <button class="speed-btn" data-speed="1.5">1.5x</button>
                                <button class="speed-btn" data-speed="2">2x</button>
                                <button class="speed-btn" data-speed="3">3x</button>
                                <button class="speed-btn" data-speed="5">5x</button>
                                <button class="speed-btn" data-speed="7">7x</button>
                            </div>
                        </div>

                        <div class="seek-section">
                            <div class="seek-label hidden" id="seekLabel">0:00 / 0:00</div>
                            <div class="seek-track hidden" id="seekTrack">
                                <div class="seek-fill" id="seekFill"></div>
                                <div class="seek-thumb" id="seekThumb"></div>
                            </div>
                        </div>
                    </div>
                </aside>
            </section>

        </div>

        <!-- Single shared video player: fixed overlay, always on top -->
        <div id="playerLayer" class="hidden">
            <div class="video-container" id="videoContainer">
                <div class="v-label hidden" id="videoLabel"></div>
                <div class="video-overlay-btns hidden" id="videoOverlayBtns">
                    <button class="v-compress hidden" id="overlayCompress">压缩</button>
                    <button class="v-delete hidden" id="overlayDelete">删除</button>
                </div>
            </div>
        </div>

        <!-- Edge hint indicators -->
        <div class="edge-hint edge-hint-left" id="edgeHintLeft"></div>
        <div class="edge-hint edge-hint-right" id="edgeHintRight"></div>
    </div>

    <!-- Upload modal -->
    <div class="modal hidden" id="uploadModal">
        <div class="modal-card">
            <div class="modal-title">上传视频</div>
            <div class="modal-drop" id="dropZone">
                <div class="drop-icon">⬆️</div>
                <p>点击选择文件，或拖拽到此处</p>
                <p class="sub">支持 mp4 / webm / mov 等</p>
            </div>
            <input type="file" id="fileInput" accept="video/*" multiple hidden>
            <div class="progress-area hidden" id="progressArea">
                <div class="progress-title" id="progressTitle"></div>
                <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
            <div class="modal-actions">
                <label class="upload-opt"><input type="checkbox" id="compressBeforeUpload" checked> 压缩后上传</label>
                <button class="cancel-btn" id="cancelBtn">关闭</button>
            </div>
        </div>
    </div>

    <script src="/vendor/hls.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
